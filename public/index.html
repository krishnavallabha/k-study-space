<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>K Study Space — IITM BS learning & exam platform</title>
<meta name="description" content="Multi-course learning and exam-preparation platform: concept pages, mapped past-paper questions with harder variations, timed mocks, error notebook and spaced repetition.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbfaf7;--panel:#ffffff;--ink:#1d1f23;--ink2:#4a4f57;--muted:#767c86;--line:#e4e1da;--line2:#efece6;
  --acc:#2f5d8a;--acc2:#e9f0f7;--good:#2d7a4f;--goodbg:#e8f4ec;--bad:#b23a3a;--badbg:#fbeaea;--warn:#9a6a10;--warnbg:#fbf3df;
  --def:#eef2f8;--defb:#5b7fb0;--intu:#f3f0fa;--intub:#7b62b5;--exam:#fff6e5;--examb:#c98a1b;--trap:#fdeeee;--trapb:#c25050;--note:#eef6f1;--noteb:#4e9a6c;
  --code:#f3f1ec;--shadow:0 1px 2px rgba(0,0,0,.05);
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;--sans:Inter,"Segoe UI",system-ui,-apple-system,sans-serif;--mono:"JetBrains Mono",Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15171b;--panel:#1c1f24;--ink:#e6e4df;--ink2:#c2c0ba;--muted:#8d9199;--line:#2e3239;--line2:#262a30;
  --acc:#7fb0e0;--acc2:#1f2b38;--good:#6cc492;--goodbg:#17291f;--bad:#ef8a8a;--badbg:#341c1c;--warn:#e6b65c;--warnbg:#30281a;
  --def:#1d2531;--defb:#6f95c9;--intu:#251f33;--intub:#a58ee0;--exam:#2e2717;--examb:#d9a441;--trap:#331d1d;--trapb:#e07a7a;--note:#1a2a21;--noteb:#6cc492;--code:#23262c;
}}
:root[data-theme="dark"]{
  --bg:#15171b;--panel:#1c1f24;--ink:#e6e4df;--ink2:#c2c0ba;--muted:#8d9199;--line:#2e3239;--line2:#262a30;
  --acc:#7fb0e0;--acc2:#1f2b38;--good:#6cc492;--goodbg:#17291f;--bad:#ef8a8a;--badbg:#341c1c;--warn:#e6b65c;--warnbg:#30281a;
  --def:#1d2531;--defb:#6f95c9;--intu:#251f33;--intub:#a58ee0;--exam:#2e2717;--examb:#d9a441;--trap:#331d1d;--trapb:#e07a7a;--note:#1a2a21;--noteb:#6cc492;--code:#23262c;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55}
a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
#top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
#top .brand{font-weight:650;letter-spacing:-.01em;white-space:nowrap}
#top .brand small{color:var(--muted);font-weight:500;margin-left:6px}
#search{flex:1;max-width:420px;margin-left:auto}
.iconbtn{background:none;border:1px solid var(--line);border-radius:6px;padding:5px 9px;color:var(--ink2)}
.iconbtn:hover{background:var(--line2)}
#menuBtn{display:none}
#layout{display:flex;min-height:calc(100vh - 50px)}
#side{width:290px;flex:none;border-right:1px solid var(--line);background:var(--panel);overflow-y:auto;height:calc(100vh - 50px);position:sticky;top:50px;padding:10px 0 40px}
#side .grp{padding:8px 16px 2px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
#side a.nav{display:flex;align-items:center;gap:6px;padding:4px 16px;color:var(--ink2);font-size:13.5px}
#side a.nav:hover{background:var(--line2);text-decoration:none}
#side a.nav.on{background:var(--acc2);color:var(--acc);font-weight:600}
#side details{margin:0}
#side summary{list-style:none;cursor:pointer;padding:5px 16px;font-size:13.5px;font-weight:600;color:var(--ink)}
#side summary::-webkit-details-marker{display:none}
#side summary:before{content:"▸";display:inline-block;width:14px;color:var(--muted);transition:transform .15s}
#side details[open]>summary:before{transform:rotate(90deg)}
#side .topic{padding:3px 16px 1px 34px;font-size:11.5px;color:var(--muted);font-weight:600}
#side a.cpt{display:flex;gap:6px;padding:3px 12px 3px 40px;font-size:13px;color:var(--ink2);line-height:1.35}
#side a.cpt:hover{background:var(--line2);text-decoration:none}
#side a.cpt.on{background:var(--acc2);color:var(--acc)}
.dot{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--muted);flex:none;margin-top:5px}
.dot.st{background:var(--acc);border-color:var(--acc)}.dot.ms{background:var(--good);border-color:var(--good)}
#main{flex:1;min-width:0;padding:24px 28px 80px}
.wrap{max-width:860px;margin:0 auto}
.wide{max-width:1100px;margin:0 auto}
h1{font-size:25px;letter-spacing:-.015em;margin:4px 0 6px;line-height:1.25}
h2{font-size:19px;margin:30px 0 8px;padding-top:6px;border-top:1px solid var(--line2)}
h3{font-size:16px;margin:20px 0 6px}
h4{font-size:14.5px;margin:14px 0 4px}
.reading{font-family:var(--serif);font-size:16.5px;line-height:1.65}
.reading h2,.reading h3,.reading h4{font-family:var(--sans)}
.muted{color:var(--muted)}.small{font-size:13px}
.crumb{font-size:12.5px;color:var(--muted)}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--ink2);background:var(--panel);margin:0 4px 4px 0;white-space:nowrap}
.tag.pyq{background:#fdf1dc;color:#8a5a00;border-color:#efd39b}
.tag.new{background:#e6f1fb;color:#1f5a91;border-color:#b9d4ee}
.tag.ga{background:#eef7ee;color:#2d6b3a;border-color:#bfe0c4}
.tag.var{background:#f3eefb;color:#5b3f9c;border-color:#d7c9f0}
.tag.hi{background:#fbe9e9;color:#a12f2f;border-color:#f0c4c4}.tag.med{background:#fff4dd;color:#8a5a00;border-color:#efd39b}.tag.sup{background:var(--line2)}
:root[data-theme="dark"] .tag.pyq,:root[data-theme="dark"] .tag.new,:root[data-theme="dark"] .tag.ga,:root[data-theme="dark"] .tag.var,:root[data-theme="dark"] .tag.hi,:root[data-theme="dark"] .tag.med{background:var(--line2);color:var(--ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tag.pyq,:root:not([data-theme="light"]) .tag.new,:root:not([data-theme="light"]) .tag.ga,:root:not([data-theme="light"]) .tag.var,:root:not([data-theme="light"]) .tag.hi,:root:not([data-theme="light"]) .tag.med{background:var(--line2);color:var(--ink)}}
.btn{background:var(--acc);color:#fff;border:0;border-radius:6px;padding:7px 14px;font-weight:600;font-size:14px}
:root[data-theme="dark"] .btn:not(.ghost){color:#10151b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn:not(.ghost){color:#10151b}}
.btn:hover{filter:brightness(1.07)}.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:none;color:var(--acc);border:1px solid var(--line)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.danger{background:var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.stat{border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:var(--panel)}
.stat .v{font-size:24px;font-weight:650;letter-spacing:-.02em}.stat .l{font-size:12px;color:var(--muted)}
.bar{height:7px;background:var(--line2);border-radius:99px;overflow:hidden;margin-top:6px}.bar>i{display:block;height:100%;background:var(--acc)}
.panel{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:14px 16px;margin:10px 0}
.box{border-left:3px solid var(--defb);background:var(--def);padding:10px 14px;border-radius:0 6px 6px 0;margin:12px 0}
.box>.bt{font-family:var(--sans);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px;color:var(--defb)}
.box.intu{border-color:var(--intub);background:var(--intu)}.box.intu>.bt{color:var(--intub)}
.box.exam{border-color:var(--examb);background:var(--exam)}.box.exam>.bt{color:var(--examb)}
.box.trap{border-color:var(--trapb);background:var(--trap)}.box.trap>.bt{color:var(--trapb)}
.box.note{border-color:var(--noteb);background:var(--note)}.box.note>.bt{color:var(--noteb)}
.box p:first-of-type{margin-top:0}.box p:last-child{margin-bottom:0}
table{border-collapse:collapse}
table.t{width:100%;font-size:13.5px;font-family:var(--sans);margin:8px 0}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
table.t th{font-size:12px;color:var(--muted);font-weight:600;background:var(--line2)}
.mtx{margin:10px auto;font-family:var(--sans);font-size:14px}
.mtx td,.mtx th{border:1px solid var(--line);padding:7px 14px;text-align:center;min-width:64px}
.mtx th{background:var(--line2);font-weight:600;font-size:13px}
.mtx .pl{border:0;background:none;color:var(--muted);font-size:12px;font-weight:600}
.mtx td.ne{background:var(--goodbg);font-weight:600;outline:2px solid var(--good);outline-offset:-2px}
.mtx td.hl{background:var(--warnbg)}
.mtx u{text-decoration-thickness:2px;text-underline-offset:3px}
.mcap{text-align:center;font-size:12.5px;color:var(--muted);font-family:var(--sans);margin-top:-4px}
.fig{overflow-x:auto;margin:10px 0;text-align:center}
.fig svg{max-width:100%;height:auto}
svg text{font-family:var(--sans);fill:var(--ink)}
.q{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:14px 16px;margin:14px 0;font-family:var(--sans);font-size:15px}
.q .qh{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-bottom:6px}
.q .stem{margin:6px 0 10px}
.q .ctx{background:var(--line2);border-radius:6px;padding:8px 12px;margin:6px 0;font-size:14px}
.q .ctx summary{cursor:pointer;color:var(--ink2);font-weight:600;font-size:13px}
.opt{display:flex;gap:8px;align-items:flex-start;padding:7px 10px;border:1px solid var(--line);border-radius:6px;margin:5px 0;cursor:pointer;background:var(--panel)}
.opt:hover{background:var(--line2)}
.opt input{margin-top:4px}
.opt.right{border-color:var(--good);background:var(--goodbg)}.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt.picked{border-color:var(--acc)}
.fb{margin-top:10px;border-radius:6px;padding:10px 12px}
.fb.ok{background:var(--goodbg)}.fb.no{background:var(--badbg)}
.sol{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px}
.sol h5{margin:10px 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.why li{margin:3px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 11px;font-size:13px;color:var(--ink2)}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
:root[data-theme="dark"] .chip.on{color:#10151b}
.toc{font-family:var(--sans);font-size:13px;display:flex;flex-wrap:wrap;gap:4px 12px;margin:8px 0 4px;padding:8px 0;border-top:1px solid var(--line2);border-bottom:1px solid var(--line2)}
.navfoot{display:flex;justify-content:space-between;gap:10px;margin-top:36px;padding-top:14px;border-top:1px solid var(--line);font-family:var(--sans)}
.card{perspective:1000px;margin:12px auto;max-width:560px}
.fc{border:1px solid var(--line);border-radius:10px;background:var(--panel);min-height:200px;padding:22px;display:flex;flex-direction:column;justify-content:center;text-align:center;font-size:17px}
.fc .side{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:8px}
.banner{background:var(--warnbg);color:var(--warn);padding:7px 14px;font-size:13px;text-align:center}
.hit{padding:6px 0;border-bottom:1px solid var(--line2)}
mark{background:#fde68a;color:inherit;padding:0 1px}
.pill-ok{color:var(--good);font-weight:600}.pill-no{color:var(--bad);font-weight:600}
.kbd{font-family:var(--mono);font-size:12px;background:var(--code);padding:1px 5px;border-radius:4px}
code{font-family:var(--mono);font-size:.88em;background:var(--code);padding:1px 4px;border-radius:4px}
ol.steps li,ul.tight li{margin:3px 0}
.ex{border:1px solid var(--line);border-radius:8px;padding:2px 16px 10px;margin:12px 0;background:var(--panel)}
.ex>.et{font-family:var(--sans);font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:10px 0 2px}
details.reveal>summary{cursor:pointer;color:var(--acc);font-family:var(--sans);font-size:14px;font-weight:600;margin:6px 0}
.tex-fallback .mjx-raw{font-family:var(--mono);font-size:.9em}
@media (max-width:900px){
  #menuBtn{display:inline-block}
  #side{position:fixed;left:0;top:50px;z-index:30;transform:translateX(-100%);transition:transform .2s;box-shadow:2px 0 12px rgba(0,0,0,.15)}
  #side.open{transform:none}
  #main{padding:16px 16px 70px}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3,.g2{grid-template-columns:1fr}
  #top .brand small{display:none}
  .reading{font-size:16px}
}
@media (max-width:520px){#search{max-width:none;min-width:0}#top .brand{display:none}}
@media print{#top,#side,.navfoot{display:none}#main{padding:0}}
/* ---- multi-course additions ---- */
#courseSel{max-width:230px;font-weight:600}
.cc{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle}
.ccard{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:18px;display:block;color:inherit}
.ccard:hover{text-decoration:none;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.ccard h3{margin:4px 0}
.tag.asg{background:#eef7ee;color:#2d6b3a;border-color:#bfe0c4}
.tag.derived{background:#fff4dd;color:#8a5a00;border-color:#efd39b}
.move{font-family:var(--sans);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--acc);margin:26px 0 2px}
.reading .lines p{margin:.35em 0}
.timer{position:sticky;top:56px;z-index:5;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;display:flex;gap:12px;align-items:center;justify-content:space-between;font-family:var(--sans)}
.timer .t{font-variant-numeric:tabular-nums;font-weight:700;font-size:18px}
.timer .t.low{color:var(--bad)}
.qnav{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}
.qnav a{display:inline-block;min-width:28px;text-align:center;border:1px solid var(--line);border-radius:5px;font-size:12px;padding:2px 4px;color:var(--ink2)}
.qnav a.ans{background:var(--acc2);border-color:var(--acc)}
.qnav a.ok{background:var(--goodbg);border-color:var(--good)}.qnav a.no{background:var(--badbg);border-color:var(--bad)}
.fatal{max-width:760px;margin:40px auto;border:2px solid var(--bad);background:var(--badbg);border-radius:10px;padding:20px;font-family:var(--sans)}
pre.code{background:var(--code);border-radius:6px;padding:10px 12px;font-family:var(--mono);font-size:13px;line-height:1.5;overflow-x:auto;text-align:left;margin:8px 0}
.reading pre.code{font-size:13.5px}
.lbox{border:1px dashed var(--line);border-radius:8px;padding:8px 12px;margin:6px 0}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;font-size:14px}
.kv b{white-space:nowrap}
.hbar{display:flex;align-items:center;gap:8px;font-size:13px;margin:3px 0}
.hbar .lab{width:230px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .trk{flex:1;height:10px;background:var(--line2);border-radius:99px;overflow:hidden}
.hbar .trk i{display:block;height:100%;background:var(--acc)}
.hbar .n{width:46px;text-align:right;font-variant-numeric:tabular-nums}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
.filters select,.filters input{font-size:13px}
.selfgrade{display:flex;gap:8px;margin-top:8px}
@media (max-width:900px){.hbar .lab{width:130px}}

</style>
</head>
<body>
<header id="top">
  <button id="menuBtn" class="iconbtn" aria-label="Open navigation">☰</button>
  <a class="brand" id="brand" href="#/" style="color:inherit;text-decoration:none">K Study Space<small id="brandSub"></small></a>
  <select id="courseSel" aria-label="Switch course"></select>
  <input id="search" type="search" placeholder="Search this course…" aria-label="Search">
  <button id="themeBtn" class="iconbtn" aria-label="Toggle light/dark theme">◐</button>
</header>
<div id="layout"><nav id="side" aria-label="Course navigation"></nav><main id="main"></main></div>
<script>
/* ---- core/00_helpers.js ---- */
/* ============================================================
   Visual + text helpers shared by every course.
   Everything returns an HTML string. Diagrams are inline SVG.
   ============================================================ */
const R = String.raw;
const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const M = {};

/* ---------- text blocks ---------- */
M.box = (kind, title, html) => `<div class="box ${kind}"><div class="bt">${title}</div>${html}</div>`;
M.def = html => M.box('', 'Terms, one per line', html);
M.rule = html => M.box('note', 'The result', html);
M.trap = html => M.box('trap', 'Trap', html);
M.tip = html => M.box('exam', 'Exam lens', html);
M.lines = arr => '<div class="lines">' + arr.map(x => `<p>${x}</p>`).join('') + '</div>';
M.steps = arr => '<ol class="steps">' + arr.map(x => `<li>${x}</li>`).join('') + '</ol>';
M.ul = arr => '<ul class="tight">' + arr.map(x => `<li>${x}</li>`).join('') + '</ul>';
M.code = (src, cap) => `<pre class="code">${esc(src.replace(/^\n+|\s+$/g, ''))}</pre>` + (cap ? `<div class="mcap">${cap}</div>` : '');
M.table = (head, rows, cap) => '<div class="fig"><table class="t">' + (head ? '<tr>' + head.map(h => `<th>${h}</th>`).join('') + '</tr>' : '') +
  rows.map(r => '<tr>' + r.map(c => `<td>${c}</td>`).join('') + '</tr>').join('') + '</table></div>' + (cap ? `<div class="mcap">${cap}</div>` : '');
/* "Why?" list: [[alternative, one-line check], ...] */
M.why = rows => '<p><b>Why? Check every alternative:</b></p><ul class="tight">' + rows.map(([a, b]) => `<li><b>${a}</b> — ${b}</li>`).join('') + '</ul>';

/* ---------- generic SVG graph ----------
   nodes: [{id, x, y, t (label, \n for new line), w, h, shape:'rect'|'round'|'circle'|'diamond'|'note', hl, fill, sub}]
   edges: [{a, b, lab, dash, hl, bend (px), back (bool, route below)}]          */
M._wrap = (t) => String(t).split('\n');
M.graph = function (nodes, edges, o = {}) {
  const by = {}; nodes.forEach(n => { n.w = n.w || Math.max(70, Math.max(...M._wrap(n.t).map(s => s.length)) * 7.4 + 18); n.h = n.h || (M._wrap(n.t).length * 16 + (n.sub ? 16 : 0) + 14); by[n.id] = n; });
  const W = o.W || Math.max(...nodes.map(n => n.x + n.w / 2)) + 20, H = o.H || Math.max(...nodes.map(n => n.y + n.h / 2)) + 24;
  const id = 'g' + Math.random().toString(36).slice(2, 7);
  let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" role="img" aria-label="${esc(o.label || 'diagram')}"><defs>
<marker id="${id}a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--ink2)"/></marker>
<marker id="${id}h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--good)"/></marker></defs>`;
  const clip = (n, tx, ty) => { // point on n's border toward (tx,ty)
    const dx = tx - n.x, dy = ty - n.y; if (!dx && !dy) return [n.x, n.y];
    if (n.shape === 'circle') { const r = n.w / 2, d = Math.hypot(dx, dy); return [n.x + dx / d * r, n.y + dy / d * r]; }
    const hw = n.w / 2 + 2, hh = n.h / 2 + 2, k = Math.min(Math.abs(dx) > 1e-9 ? hw / Math.abs(dx) : 1e9, Math.abs(dy) > 1e-9 ? hh / Math.abs(dy) : 1e9);
    return [n.x + dx * k, n.y + dy * k];
  };
  edges.forEach(e => {
    const A = by[e.a], B = by[e.b]; if (!A || !B) return;
    const col = e.hl ? 'var(--good)' : 'var(--ink2)', mk = `url(#${id}${e.hl ? 'h' : 'a'})`;
    if (e.back) { // route underneath: down from A, across, up into B
      const yb = Math.max(A.y + A.h / 2, B.y + B.h / 2) + (e.drop || 26);
      s += `<path d="M${A.x},${A.y + A.h / 2} L${A.x},${yb} L${B.x},${yb} L${B.x},${B.y + B.h / 2 + 2}" fill="none" stroke="${col}" stroke-width="${e.hl ? 2.6 : 1.5}" ${e.dash ? 'stroke-dasharray="5 4"' : ''} marker-end="${mk}"/>`;
      if (e.lab) s += `<text x="${(A.x + B.x) / 2}" y="${yb - 5}" font-size="11.5" text-anchor="middle" fill="var(--muted)">${e.lab}</text>`;
      return;
    }
    let [x1, y1] = clip(A, B.x, B.y), [x2, y2] = clip(B, A.x, A.y);
    let d = `M${x1},${y1} L${x2},${y2}`, lx = (x1 + x2) / 2, ly = (y1 + y2) / 2 - 6;
    if (e.bend) { const mx = (x1 + x2) / 2, my = (y1 + y2) / 2, nx = -(y2 - y1), ny = x2 - x1, L = Math.hypot(nx, ny) || 1, cx = mx + nx / L * e.bend, cy = my + ny / L * e.bend; d = `M${x1},${y1} Q${cx},${cy} ${x2},${y2}`; lx = cx; ly = cy; }
    s += `<path d="${d}" fill="none" stroke="${col}" stroke-width="${e.hl ? 2.6 : 1.5}" ${e.dash ? 'stroke-dasharray="5 4"' : ''} marker-end="${e.noArrow ? '' : mk}"/>`;
    if (e.lab) s += `<text x="${lx}" y="${ly}" font-size="11.5" text-anchor="middle" fill="var(--ink2)" paint-order="stroke" stroke="var(--bg)" stroke-width="4">${e.lab}</text>`;
  });
  nodes.forEach(n => {
    const fill = n.fill || (n.hl ? 'var(--goodbg)' : 'var(--panel)'), st = n.hl ? 'var(--good)' : 'var(--ink2)', sw = n.hl ? 2.2 : 1.3;
    if (n.shape === 'circle') s += `<circle cx="${n.x}" cy="${n.y}" r="${n.w / 2}" fill="${fill}" stroke="${st}" stroke-width="${sw}"/>`;
    else if (n.shape === 'diamond') s += `<polygon points="${n.x},${n.y - n.h / 2} ${n.x + n.w / 2},${n.y} ${n.x},${n.y + n.h / 2} ${n.x - n.w / 2},${n.y}" fill="${fill}" stroke="${st}" stroke-width="${sw}"/>`;
    else s += `<rect x="${n.x - n.w / 2}" y="${n.y - n.h / 2}" width="${n.w}" height="${n.h}" rx="${n.shape === 'round' ? 14 : 5}" fill="${fill}" stroke="${st}" stroke-width="${sw}"/>`;
    const L = M._wrap(n.t), top = n.y - ((L.length - 1) * 16 + (n.sub ? 16 : 0)) / 2 + 4;
    L.forEach((ln, i) => { s += `<text x="${n.x}" y="${top + i * 16}" font-size="13" text-anchor="middle" font-weight="600">${ln}</text>`; });
    if (n.sub) s += `<text x="${n.x}" y="${top + L.length * 16}" font-size="11.5" text-anchor="middle" fill="var(--muted)">${n.sub}</text>`;
  });
  (o.notes || []).forEach(t => { s += `<text x="${t.x}" y="${t.y}" font-size="${t.fs || 12}" text-anchor="${t.a || 'middle'}" fill="${t.c || 'var(--muted)'}" font-weight="${t.b ? 700 : 400}">${t.t}</text>`; });
  s += '</svg>';
  return `<div class="fig">${s}</div>` + (o.cap ? `<div class="mcap">${o.cap}</div>` : '');
};

/* Horizontal chain of boxes: items = ['A','B',...] or [{t,sub,hl}], o.loop adds a return arrow (cycle). */
M.flow = function (items, o = {}) {
  const gap = o.gap || 46; let x = 20; const y = o.y || 40;
  const nodes = items.map((it, i) => { const n = typeof it === 'string' ? { t: it } : { ...it }; n.id = 'n' + i; n.y = y; n.w = n.w || Math.max(80, Math.max(...M._wrap(n.t).map(s => s.length)) * 7.4 + 18); n.x = x + n.w / 2; x += n.w + gap; n.shape = n.shape || 'round'; return n; });
  const edges = nodes.slice(1).map((n, i) => ({ a: 'n' + i, b: n.id, lab: (o.labs || [])[i] }));
  if (o.loop) edges.push({ a: nodes[nodes.length - 1].id, b: nodes[0].id, back: true, lab: o.loop === true ? '' : o.loop, dash: true });
  return M.graph(nodes, edges, { cap: o.cap, label: o.label, H: o.loop ? y + 70 : undefined });
};

/* ---------- UML class diagram ----------
   classes: [{id, name, attrs:[], ops:[], x, y, stereo}]  (x,y = top-left)
   rels: [{a, b, k:'assoc'|'comp'|'agg'|'inh'|'dep'|'line', lab}]
     comp/agg: diamond at b (b = the WHOLE).  inh: hollow triangle at b (b = PARENT).
     assoc: open arrow at b (a uses b).  dep: dashed arrow a -> b.  line: plain association line. */
M.uml = function (classes, rels, o = {}) {
  const by = {};
  classes.forEach(c => {
    const rows = [c.name, ...(c.attrs || []), ...(c.ops || [])];
    c.w = c.w || Math.max(110, Math.max(...rows.map(r => r.length)) * 7 + 22);
    c.h = 26 + (c.stereo ? 13 : 0) + ((c.attrs || []).length || (c.compact ? 0 : 0.6)) * 16 + 8 + ((c.ops || []).length || (c.compact ? 0 : 0.6)) * 16 + 6;
    if (c.compact) c.h = 34;
    by[c.id] = c;
  });
  const W = o.W || Math.max(...classes.map(c => c.x + c.w)) + 20, H = o.H || Math.max(...classes.map(c => c.y + c.h)) + 20;
  const cx = c => c.x + c.w / 2, cy = c => c.y + c.h / 2;
  const clip = (c, tx, ty) => { const dx = tx - cx(c), dy = ty - cy(c); const k = Math.min(Math.abs(dx) > 1e-9 ? (c.w / 2) / Math.abs(dx) : 1e9, Math.abs(dy) > 1e-9 ? (c.h / 2) / Math.abs(dy) : 1e9); return [cx(c) + dx * k, cy(c) + dy * k]; };
  let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" role="img" aria-label="UML class diagram">`;
  rels.forEach(r => {
    const A = by[r.a], B = by[r.b]; if (!A || !B) return;
    const [x1, y1] = clip(A, cx(B), cy(B)), [x2, y2] = clip(B, cx(A), cy(A));
    const ang = Math.atan2(y2 - y1, x2 - x1), ux = Math.cos(ang), uy = Math.sin(ang), px = -uy, py = ux;
    let ex = x2, ey = y2, head = '';
    if (r.k === 'comp' || r.k === 'agg') { // diamond at B
      const L = 18, Wd = 7, bx = x2 - ux * L, by_ = y2 - uy * L, mx = x2 - ux * L / 2, my = y2 - uy * L / 2;
      head = `<polygon points="${x2},${y2} ${mx + px * Wd},${my + py * Wd} ${bx},${by_} ${mx - px * Wd},${my - py * Wd}" fill="${r.k === 'comp' ? 'var(--ink)' : 'var(--panel)'}" stroke="var(--ink)" stroke-width="1.3"/>`; ex = bx; ey = by_;
    } else if (r.k === 'inh') {
      const L = 15, Wd = 9, bx = x2 - ux * L, by_ = y2 - uy * L;
      head = `<polygon points="${x2},${y2} ${bx + px * Wd},${by_ + py * Wd} ${bx - px * Wd},${by_ - py * Wd}" fill="var(--panel)" stroke="var(--ink)" stroke-width="1.3"/>`; ex = bx; ey = by_;
    } else if (r.k === 'assoc' || r.k === 'dep') {
      const L = 11, Wd = 6, bx = x2 - ux * L, by_ = y2 - uy * L;
      head = `<polyline points="${bx + px * Wd},${by_ + py * Wd} ${x2},${y2} ${bx - px * Wd},${by_ - py * Wd}" fill="none" stroke="var(--ink)" stroke-width="1.4"/>`;
    }
    s += `<line x1="${x1}" y1="${y1}" x2="${ex}" y2="${ey}" stroke="var(--ink)" stroke-width="1.3" ${r.k === 'dep' ? 'stroke-dasharray="6 4"' : ''}/>` + head;
    if (r.lab) s += `<text x="${(x1 + x2) / 2 + px * 10}" y="${(y1 + y2) / 2 + py * 10 - 2}" font-size="11.5" text-anchor="middle" fill="var(--muted)">${r.lab}</text>`;
  });
  classes.forEach(c => {
    s += `<rect x="${c.x}" y="${c.y}" width="${c.w}" height="${c.h}" fill="${c.hl ? 'var(--acc2)' : 'var(--panel)'}" stroke="var(--ink)" stroke-width="1.3"/>`;
    let y = c.y + 18;
    if (c.stereo) { s += `<text x="${c.x + c.w / 2}" y="${y - 2}" font-size="10.5" text-anchor="middle" fill="var(--muted)">«${c.stereo}»</text>`; y += 13; }
    s += `<text x="${c.x + c.w / 2}" y="${y}" font-size="13" font-weight="700" text-anchor="middle">${c.name}</text>`;
    if (c.compact) return;
    y += 8; s += `<line x1="${c.x}" y1="${y}" x2="${c.x + c.w}" y2="${y}" stroke="var(--ink)" stroke-width="1"/>`;
    (c.attrs || []).forEach(a => { y += 16; s += `<text x="${c.x + 8}" y="${y - 3}" font-size="12">${esc(a)}</text>`; });
    y += (c.attrs || []).length ? 6 : 10; s += `<line x1="${c.x}" y1="${y}" x2="${c.x + c.w}" y2="${y}" stroke="var(--ink)" stroke-width="1"/>`;
    (c.ops || []).forEach(a => { y += 16; s += `<text x="${c.x + 8}" y="${y - 3}" font-size="12">${esc(a)}</text>`; });
  });
  s += '</svg>';
  return `<div class="fig">${s}</div>` + (o.cap ? `<div class="mcap">${o.cap}</div>` : '');
};
/* Legend of the four UML relationship arrows */

/* ---------- activity network with automatic critical path ----------
   tasks: [{id, t, d}], deps: [[from, to], ...]  -> layered layout, longest path highlighted */
M.net = function (tasks, deps, o = {}) {
  const cp = CALC.critical(tasks, deps);
  const lvl = {}; const order = cp.order;
  order.forEach(id => { lvl[id] = Math.max(0, ...deps.filter(d => d[1] === id).map(d => lvl[d[0]] + 1)); });
  const cols = {}; order.forEach(id => (cols[lvl[id]] = cols[lvl[id]] || []).push(id));
  const brk = s => { if (s.length <= 14 || s.includes('\n')) return s; const sp = [...s.matchAll(/ /g)].map(m => m.index); if (!sp.length) return s; const k = sp.reduce((a, b) => Math.abs(b - s.length / 2) < Math.abs(a - s.length / 2) ? b : a); return s.slice(0, k) + '\n' + s.slice(k + 1); };
  const lab = {}; tasks.forEach(t => lab[t.id] = brk(t.t));
  const wOf = id => Math.max(96, Math.max(...lab[id].split('\n').map(x => x.length)) * 7.4 + 18);
  const colW = o.colW || Math.max(...tasks.map(t => wOf(t.id))) + 34, rowH = o.rowH || 78, maxRows = Math.max(...Object.values(cols).map(c => c.length));
  const nodes = tasks.map(t => { const c = cols[lvl[t.id]], i = c.indexOf(t.id); return { id: t.id, t: lab[t.id], sub: t.d + (o.unit || ' d'), x: colW / 2 + 10 + lvl[t.id] * colW, y: 44 + (i + (maxRows - c.length) / 2) * rowH, w: wOf(t.id), hl: o.noCP ? false : cp.path.includes(t.id) }; });
  const onPath = (a, b) => !o.noCP && cp.path.indexOf(a) > -1 && cp.path.indexOf(b) === cp.path.indexOf(a) + 1;
  const edges = deps.map(([a, b]) => ({ a, b, hl: onPath(a, b) }));
  const cap = o.cap || (o.noCP ? '' : `Critical path (green) = ${cp.path.map(id => tasks.find(t => t.id === id).t.replace(/\n/g, ' ')).join(' → ')} = ${cp.len}${o.unit || ' days'}.`);
  return M.graph(nodes, edges, { cap, label: 'activity network' });
};

/* ---------- simple bar chart ---------- bars: [{lab, v}], o.line: value for a dashed reference line */
M.bars = function (bars, o = {}) {
  bars.forEach(b => { b.lab = b.lab || b.t || ''; if (b.hl && !b.c) b.c = 'var(--good)'; });
  const bw = o.bw || Math.max(46, ...bars.map(b => b.lab.length * 6.4)), gap = 18, L = 40, H = o.H || 150, top = 16, mx = Math.max(...bars.map(b => b.v), o.line || 0) * 1.15;
  const W = L + bars.length * (bw + gap) + 20;
  let s = `<svg viewBox="0 0 ${W} ${H + top + 30}" width="${W}" role="img" aria-label="bar chart">`;
  s += `<line x1="${L - 6}" y1="${top + H}" x2="${W - 6}" y2="${top + H}" stroke="var(--ink2)"/>`;
  bars.forEach((b, i) => { const h = b.v / mx * H, x = L + i * (bw + gap); s += `<rect x="${x}" y="${top + H - h}" width="${bw}" height="${h}" rx="3" fill="${b.c || 'var(--acc)'}" opacity=".85"/><text x="${x + bw / 2}" y="${top + H - h - 4}" font-size="12" text-anchor="middle">${b.v}${o.unit || ''}</text><text x="${x + bw / 2}" y="${top + H + 16}" font-size="11.5" text-anchor="middle" fill="var(--muted)">${b.lab}</text>`; });
  if (o.line != null) { const y = top + H - o.line / mx * H; s += `<line x1="${L - 6}" y1="${y}" x2="${W - 6}" y2="${y}" stroke="var(--good)" stroke-width="2" stroke-dasharray="6 4"/><text x="${W - 8}" y="${y - 5}" font-size="12" text-anchor="end" fill="var(--good)" font-weight="700">${o.lineLab || o.line}</text>`; }
  s += '</svg>';
  return `<div class="fig">${s}</div>` + (o.cap ? `<div class="mcap">${o.cap}</div>` : '');
};

/* ---------- ranked ladder (best at top) ---------- items: [{t, d}] */
M.ladder = function (items, o = {}) {
  const rowH = 40, W = o.W || 560, H = items.length * rowH + 30;
  let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" role="img" aria-label="ranked ladder">`;
  items.forEach((it, i) => {
    const y = 10 + i * rowH, f = i / Math.max(1, items.length - 1);
    s += `<rect x="40" y="${y}" width="${W - 50}" height="${rowH - 8}" rx="6" fill="var(--panel)" stroke="${f < .34 ? 'var(--good)' : f > .66 ? 'var(--bad)' : 'var(--warn)'}" stroke-width="1.6"/>`;
    s += `<text x="52" y="${y + 21}" font-size="13.5" font-weight="700">${i + 1}. ${it.t}</text><text x="${W - 18}" y="${y + 21}" font-size="12" text-anchor="end" fill="var(--muted)">${it.d || ''}</text>`;
  });
  s += `<text x="20" y="22" font-size="11" text-anchor="middle" fill="var(--good)" font-weight="700">${o.top || 'best'}</text><text x="20" y="${H - 22}" font-size="11" text-anchor="middle" fill="var(--bad)" font-weight="700">${o.bottom || 'worst'}</text>`;
  s += `<line x1="20" y1="30" x2="20" y2="${H - 36}" stroke="var(--muted)" stroke-width="1.5" marker-end=""/>`;
  s += '</svg>';
  return `<div class="fig">${s}</div>` + (o.cap ? `<div class="mcap">${o.cap}</div>` : '');
};

/* ---------- 2×2 quadrant ---------- o: {x:'Coupling', y:'Cohesion', cells:[[tl,tr],[bl,br]], hl:[r,c], xl:['low','high'], yl:['high','low']} */
M.quad = function (o) {
  const W = 470, H = 330, x0 = 90, y0 = 20, cw = 175, ch = 130;
  let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" role="img" aria-label="quadrant">`;
  for (let r = 0; r < 2; r++) for (let c = 0; c < 2; c++) {
    const on = o.hl && o.hl[0] === r && o.hl[1] === c, good = o.good && o.good[0] === r && o.good[1] === c;
    s += `<rect x="${x0 + c * cw}" y="${y0 + r * ch}" width="${cw - 6}" height="${ch - 6}" rx="8" fill="${good ? 'var(--goodbg)' : on ? 'var(--warnbg)' : 'var(--panel)'}" stroke="${on ? 'var(--warn)' : good ? 'var(--good)' : 'var(--line)'}" stroke-width="${on || good ? 2.2 : 1.2}"/>`;
    M._wrap(o.cells[r][c]).forEach((ln, i, A) => { s += `<text x="${x0 + c * cw + cw / 2 - 3}" y="${y0 + r * ch + ch / 2 - (A.length - 1) * 8 + i * 16}" font-size="12.5" text-anchor="middle">${ln}</text>`; });
  }
  s += `<text x="${x0 + cw - 3}" y="${H - 6}" font-size="13" text-anchor="middle" font-weight="700">${o.x} →</text>`;
  (o.xl || []).forEach((t, i) => { s += `<text x="${x0 + i * cw + cw / 2 - 3}" y="${y0 + 2 * ch + 12}" font-size="11.5" text-anchor="middle" fill="var(--muted)">${t}</text>`; });
  s += `<text x="16" y="${y0 + ch}" font-size="13" font-weight="700" transform="rotate(-90 16 ${y0 + ch})" text-anchor="middle">${o.y}</text>`;
  (o.yl || []).forEach((t, i) => { s += `<text x="${x0 - 8}" y="${y0 + i * ch + ch / 2}" font-size="11.5" text-anchor="end" fill="var(--muted)">${t}</text>`; });
  s += '</svg>';
  return `<div class="fig">${s}</div>` + (o.cap ? `<div class="mcap">${o.cap}</div>` : '');
};

/* ---------- Kanban / sprint board ---------- cols: [{t, cards:[..]}] */
M.board = function (cols, o = {}) {
  const cw = 150, W = cols.length * (cw + 12) + 12, maxc = Math.max(...cols.map(c => c.cards.length)), H = 44 + maxc * 40 + 12;
  let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" role="img" aria-label="board">`;
  cols.forEach((c, i) => {
    const x = 12 + i * (cw + 12);
    s += `<rect x="${x}" y="6" width="${cw}" height="${H - 12}" rx="8" fill="var(--line2)"/><text x="${x + cw / 2}" y="28" font-size="13" font-weight="700" text-anchor="middle">${c.t}</text>`;
    c.cards.forEach((k, j) => { const kk = typeof k === 'string' ? { t: k } : k; s += `<rect x="${x + 8}" y="${40 + j * 40}" width="${cw - 16}" height="32" rx="5" fill="${kk.hl ? 'var(--warnbg)' : 'var(--panel)'}" stroke="var(--line)"/><text x="${x + cw / 2}" y="${60 + j * 40}" font-size="11.5" text-anchor="middle">${kk.t}</text>`; });
  });
  s += '</svg>';
  return `<div class="fig">${s}</div>` + (o.cap ? `<div class="mcap">${o.cap}</div>` : '');
};

/* ---------- Git branch graph ----------
   lanes: ['master','feature1'], commits: [{l:laneIndex, x:step, t:'label', hl}], links: [[l1,x1,l2,x2,'label']] */
M.git = function (lanes, commits, links, o = {}) {
  const dx = 70, dy = 52, L = 110, steps = Math.max(...commits.map(c => c.x)) + 1, W = L + steps * dx + 20, H = lanes.length * dy + 20;
  const X = x => L + x * dx, Y = l => 26 + l * dy, colr = l => ['var(--acc)', 'var(--good)', 'var(--warn)', 'var(--bad)'][l % 4];
  let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" role="img" aria-label="git graph">`;
  lanes.forEach((ln, l) => { const xs = commits.filter(c => c.l === l).map(c => c.x); if (!xs.length) return; s += `<text x="${L - 20}" y="${Y(l) + 4}" font-size="12.5" text-anchor="end" font-weight="700" fill="${colr(l)}">${ln}</text><line x1="${X(Math.min(...xs))}" y1="${Y(l)}" x2="${X(Math.max(...xs))}" y2="${Y(l)}" stroke="${colr(l)}" stroke-width="3"/>`; });
  links.forEach(([l1, x1, l2, x2, t]) => { s += `<path d="M${X(x1)},${Y(l1)} C${X(x1) + 30},${Y(l1)} ${X(x2) - 30},${Y(l2)} ${X(x2)},${Y(l2)}" fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="${t && /merge|rebase/.test(t) ? '0' : '5 4'}"/>`; if (t) s += `<text x="${(X(x1) + X(x2)) / 2}" y="${(Y(l1) + Y(l2)) / 2 - 4}" font-size="11" text-anchor="middle" fill="var(--muted)">${t}</text>`; });
  commits.forEach(c => { s += `<circle cx="${X(c.x)}" cy="${Y(c.l)}" r="8" fill="${c.hl ? 'var(--warnbg)' : 'var(--panel)'}" stroke="${colr(c.l)}" stroke-width="3"/>`; if (c.t) s += `<text x="${X(c.x)}" y="${Y(c.l) + 24}" font-size="11" text-anchor="middle">${c.t}</text>`; });
  s += '</svg>';
  return `<div class="fig">${s}</div>` + (o.cap ? `<div class="mcap">${o.cap}</div>` : '');
};

/* ---------- line plot ---------- lines: [{f, lab, c}], o: {x0,x1,y1,xl,yl, pts:[{x,y,lab}]} */
M.plot = function (lines, o) {
  const W = 520, H = 300, L = 56, B = 40, T = 14, Rr = 120, pw = W - L - Rr, ph = H - B - T;
  const X = x => L + (x - o.x0) / (o.x1 - o.x0) * pw, Y = y => T + ph - y / o.y1 * ph;
  let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" role="img" aria-label="plot"><line x1="${L}" y1="${T + ph}" x2="${L + pw}" y2="${T + ph}" stroke="var(--ink2)"/><line x1="${L}" y1="${T}" x2="${L}" y2="${T + ph}" stroke="var(--ink2)"/>`;
  for (let i = 0; i <= 4; i++) { const xv = o.x0 + (o.x1 - o.x0) * i / 4, yv = o.y1 * i / 4; s += `<text x="${X(xv)}" y="${T + ph + 16}" font-size="11" text-anchor="middle" fill="var(--muted)">${+xv.toFixed(0)}</text><text x="${L - 6}" y="${Y(yv) + 4}" font-size="11" text-anchor="end" fill="var(--muted)">${+yv.toFixed(0)}</text>`; }
  s += `<text x="${L + pw / 2}" y="${H - 4}" font-size="12" text-anchor="middle">${o.xl}</text><text x="14" y="${T + ph / 2}" font-size="12" text-anchor="middle" transform="rotate(-90 14 ${T + ph / 2})">${o.yl}</text>`;
  const cols = ['var(--good)', 'var(--acc)', 'var(--bad)', 'var(--warn)'];
  lines.forEach((ln, k) => { let d = ''; for (let i = 0; i <= 60; i++) { const x = o.x0 + (o.x1 - o.x0) * i / 60; d += (i ? 'L' : 'M') + X(x).toFixed(1) + ',' + Y(Math.min(ln.f(x), o.y1 * 1.05)).toFixed(1); } s += `<path d="${d}" fill="none" stroke="${ln.c || cols[k]}" stroke-width="2.4"/><text x="${L + pw + 6}" y="${Y(Math.min(ln.f(o.x1), o.y1)) + 4}" font-size="12" fill="${ln.c || cols[k]}" font-weight="700">${ln.lab}</text>`; });
  (o.pts || []).forEach(p => { s += `<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="4.5" fill="var(--ink)"/><text x="${X(p.x) + 7}" y="${Y(p.y) - 7}" font-size="11.5">${p.lab}</text>`; });
  s += '</svg>';
  return `<div class="fig">${s}</div>` + (o.cap ? `<div class="mcap">${o.cap}</div>` : '');
};

/* ---- core/10_registry.js ---- */
/* ============================================================
   Course registry. Content files call these functions; the app
   never needs to change when a course or week is added.
   Load order (build.py): core → each course (course.js, w*.js,
   pyq.js, extra.js) → app.
   ============================================================ */
const COURSES = {}, COURSE_ORDER = [];
let CUR = null;
const LABELS = { PYQ: 'PYQ', ASSIGNMENT: 'ASSIGNMENT', NEW: 'NEW', VARIATION: 'VARIATION' };

function COURSE(o) {
  Object.assign(o, { weeks: [], concepts: [], cmap: {}, qs: [], qmap: {}, gloss: [], cards: [], formulas: [], compare: [], sheets: {},
    sources: [], limits: [], papers: {}, families: {}, intel: [], _dups: [], _n: 0 });
  COURSES[o.code] = o; COURSE_ORDER.push(o.code); CUR = o; return o;
}
const _course = code => { const c = code ? COURSES[code] : CUR; if (!c) throw new Error('Unknown course ' + code + ' — call COURSE() first'); CUR = c; return c; };

function WEEK(o) { const c = _course(o.course); o.course = c.code; o.topics = o.topics || []; c.weeks.push(o); c.weeks.sort((a, b) => a.n - b.n); return o; }

/* Concept. Required: id, week, title, pri, intu, why, formal, vis, math, ex[3], conn, mis, exam, src, prereq */
function C(o) { const c = _course(o.course); o.course = c.code; if (c.cmap[o.id]) c._dups.push('concept ' + o.id); c.cmap[o.id] = o; c.concepts.push(o); return o; }

function _addQ(c, o) {
  o.course = c.code;
  if (!o.id) o.id = c.code + '-q' + (++c._n);
  if (c.qmap[o.id]) c._dups.push('question ' + o.id);
  c.qmap[o.id] = o; c.qs.push(o); return o;
}
/* Checkpoint / practice question. cp = concept it checks. src defaults to NEW. */
function Q(o) {
  const c = _course(o.course); o.src = o.src || 'NEW';
  if (o.cp) { o.cs = o.cs || [o.cp]; if (!o.id) { const k = c.qs.filter(q => q.cp === o.cp).length + 1; o.id = c.code + '-' + o.cp + '-c' + k; } }
  return _addQ(c, o);
}
/* Past-paper question. id = <course>-<paper>-<qno>. otype: mcq|msq|num|text */
function PQ(course, paper, qno, marks, otype, o) {
  const c = _course(course);
  Object.assign(o, { id: `${course}-${paper}-${qno}`, src: 'PYQ', paper, qno, marks, type: otype });
  return _addQ(c, o);
}
/* Harder variation of one or more PYQs (a whole family). */
function VQ(o, pyqIds) {
  const c = _course(o.course); o.src = 'VARIATION'; o.varOf = [].concat(pyqIds); o.diff = o.diff || 'hard';
  if (!o.id) o.id = c.code + '-v' + (c.qs.filter(q => q.src === 'VARIATION').length + 1);
  return _addQ(c, o);
}
function PAPER(course, id, meta) { _course(course).papers[id] = Object.assign({ id }, meta); }
function FAMILY(id, meta) { const c = _course(meta.course); c.families[id] = Object.assign({ id }, meta); }
function GLOSS(term, def, week) { _course().gloss.push({ term, def, week }); }
function CARD(front, back, week) { const c = _course(); c.cards.push({ id: c.code + '-k' + (c.cards.length + 1), front, back, week }); }
function FORMULA(o) { _course().formulas.push(o); }
function COMPARE(o) { _course().compare.push(o); }
function SHEET(week, html) { _course().sheets[week] = html; }
function SOURCE(o) { _course().sources.push(o); }
function LIMIT(t) { _course().limits.push(t); }
function INTEL(o) { _course().intel.push(o); }

/* Resolve cross-references once every file has loaded. */
function FINALIZE() {
  COURSE_ORDER.forEach(code => {
    const c = COURSES[code];
    c.qs.forEach(q => {
      if (q.src === 'VARIATION') {
        const base = q.varOf.map(id => c.qmap[id]).filter(Boolean);
        if (base[0]) { q.cs = q.cs || base[0].cs; q.week = q.week || base[0].week; q.fam = q.fam || base[0].fam; }
      }
      if (q.week == null && q.cs && c.cmap[q.cs[0]]) q.week = c.cmap[q.cs[0]].week;
      q.cs = q.cs || [];
    });
    c.vars = {}; c.qs.filter(q => q.src === 'VARIATION').forEach(v => v.varOf.forEach(id => (c.vars[id] = c.vars[id] || []).push(v.id)));
    c.verify = VERIFY(c);
  });
}

/* ---- core/20_compute.js ---- */
/* ============================================================
   Calculators. Any question whose answer can be computed carries
   calc: () => value. VERIFY() recomputes every such key at load;
   the app refuses to start if a key disagrees with the maths.
   ============================================================ */
const CALC = {
  COCOMO: { organic: [2.4, 1.05], semi: [3.0, 1.12], embedded: [3.6, 1.20] },
  /* Basic COCOMO effort in person-months: a × KLOC^b × EAF */
  cocomo(mode, kloc, eaf = 1) { const [a, b] = Array.isArray(mode) ? mode : CALC.COCOMO[mode]; return a * Math.pow(kloc, b) * eaf; },
  prod: arr => arr.reduce((p, x) => p * x, 1),
  sum: arr => arr.reduce((p, x) => p + x, 0),
  avg: arr => CALC.sum(arr) / arr.length,
  risk: (p, i) => p * i,
  /* Pick the label with the highest P × I. rows: [[label, p, i], ...] */
  topRisk: rows => rows.map(([l, p, i]) => [l, p * i]).sort((a, b) => b[1] - a[1])[0][0],
  /* Cyclomatic complexity of a Python snippet = decision points + 1.
     Counts if / elif / for / while (and case); never else. */
  cc(code) {
    let d = 0;
    code.split('\n').forEach(line => { const s = line.replace(/#.*/, '').trim(); if (/^(if|elif|for|while|case)\b/.test(s)) d++; });
    return d + 1;
  },
  /* Activity network: tasks [{id,d}], deps [[from,to]] → {order, ef, len, path, slack} */
  critical(tasks, deps) {
    const ids = tasks.map(t => t.id), dur = {}; tasks.forEach(t => dur[t.id] = t.d);
    const indeg = {}; ids.forEach(i => indeg[i] = 0); deps.forEach(([, b]) => indeg[b]++);
    const order = [], q = ids.filter(i => !indeg[i]);
    while (q.length) { const n = q.shift(); order.push(n); deps.filter(d => d[0] === n).forEach(([, b]) => { if (!--indeg[b]) q.push(b); }); }
    const es = {}, ef = {}, prev = {};
    order.forEach(n => { const ps = deps.filter(d => d[1] === n).map(d => d[0]); es[n] = 0; ps.forEach(p => { if (ef[p] > es[n]) { es[n] = ef[p]; prev[n] = p; } }); ef[n] = es[n] + dur[n]; });
    const len = Math.max(...ids.map(i => ef[i])); let end = ids.find(i => ef[i] === len); const path = [];
    while (end) { path.unshift(end); end = prev[end]; }
    const lf = {}; [...order].reverse().forEach(n => { const ss = deps.filter(d => d[0] === n).map(d => d[1]); lf[n] = ss.length ? Math.min(...ss.map(s => lf[s] - dur[s])) : len; });
    const slack = {}; ids.forEach(i => slack[i] = lf[i] - ef[i]);
    return { order, es, ef, len, path, slack };
  },
  /* Read a numeric value out of an option label: "Rs. 14,70,000/-" → 1470000, "146 Person-Months" → 146 */
  num(t) { const m = String(t).replace(/,/g, '').match(/-?\d+(\.\d+)?/); return m ? parseFloat(m[0]) : NaN; },
  /* Parse a typed numeric answer, accepting fractions like 3/4 */
  parse(s) { s = String(s).trim().replace(/,/g, ''); const f = s.match(/^(-?\d+(?:\.\d+)?)\s*\/\s*(-?\d+(?:\.\d+)?)$/); if (f) return parseFloat(f[1]) / parseFloat(f[2]); return s === '' ? NaN : Number(s); },
  round: (x, d = 2) => Math.round(x * Math.pow(10, d)) / Math.pow(10, d)
};

/* Recompute every key that carries calc(). Returns [{id, ok, msg}]. */
function VERIFY(c) {
  const out = [];
  c.qs.filter(q => typeof q.calc === 'function').forEach(q => {
    let v; try { v = q.calc(); } catch (e) { out.push({ id: q.id, ok: false, msg: 'calc threw: ' + e.message }); return; }
    if (typeof v === 'string') {
      const keyText = q.type === 'mcq' ? q.opts[q.ans] : String(q.ans);
      const ok = String(keyText).trim().toLowerCase() === v.trim().toLowerCase();
      out.push({ id: q.id, ok, msg: ok ? 'matches "' + v + '"' : `computed "${v}" but key is "${keyText}"` }); return;
    }
    if (q.type === 'mcq') {
      const vals = q.opts.map(CALC.num);
      let best = 0; vals.forEach((x, i) => { if (Math.abs(x - v) < Math.abs(vals[best] - v)) best = i; });
      const rel = Math.abs(vals[q.ans] - v) / Math.max(1e-9, Math.abs(v));
      const ok = best === q.ans && rel <= (q.relTol || 0.03);
      out.push({ id: q.id, ok, msg: `computed ${CALC.round(v, 3)} → nearest option ${best + 1} (${q.opts[best]}); key = option ${q.ans + 1}; off by ${(rel * 100).toFixed(2)}%` });
    } else if (q.type === 'num') {
      const ok = Math.abs(v - q.ans) <= (q.tol || 1e-9) + 1e-9;
      out.push({ id: q.id, ok, msg: `computed ${CALC.round(v, 4)}; key ${q.ans} ± ${q.tol || 0}` });
    } else out.push({ id: q.id, ok: false, msg: 'calc on unsupported type ' + q.type });
  });
  return out;
}

/* ---- core/30_validate.js ---- */
/* ============================================================
   Content validator. Shared by the in-browser QA page and by
   scripts/check.js (Node). Target: 0 errors, no PYQ without a
   variation.
   ============================================================ */
const CONCEPT_FIELDS = ['intu', 'why', 'formal', 'vis', 'math', 'ex', 'conn', 'mis', 'exam', 'src', 'prereq', 'pri'];
const QTYPES = ['mcq', 'msq', 'num', 'text', 'short'];

function VALIDATE(code) {
  const c = COURSES[code], E = [], W = [];
  const err = (...a) => E.push(a.join(' ')), warn = (...a) => W.push(a.join(' '));
  c._dups.forEach(d => err('duplicate id:', d));
  if (!c.exams || !c.exams.length) err('course has no exams');
  /* weeks and topics */
  const placed = {};
  c.weeks.forEach(w => w.topics.forEach(t => t.cs.forEach(id => {
    if (!c.cmap[id]) err(`week ${w.n}: topic "${t.title}" lists missing concept`, id);
    if (placed[id]) err('concept listed in two topics:', id); placed[id] = 1;
  })));
  /* concepts */
  c.concepts.forEach(k => {
    CONCEPT_FIELDS.forEach(f => { const v = k[f]; if (v == null || v === '' || (f !== 'prereq' && Array.isArray(v) && !v.length)) err('concept', k.id, 'missing field', f); });
    if (!placed[k.id]) err('concept not placed in any week topic:', k.id);
    if (!Array.isArray(k.ex) || k.ex.length !== 3) err('concept', k.id, 'needs exactly 3 worked examples (has', (k.ex || []).length + ')');
    else k.ex.forEach((e, i) => { if (!e.q || !e.a) err('concept', k.id, 'example', i + 1, 'incomplete'); });
    if (!['High', 'Medium', 'Supporting'].includes(k.pri)) err('concept', k.id, 'bad pri', k.pri);
    if (!Array.isArray(k.prereq)) err('concept', k.id, 'prereq must be an array');
    else k.prereq.forEach(p => { if (!c.cmap[p]) err('concept', k.id, 'unknown prereq', p); });
    if (!c.weeks.some(w => w.n === k.week)) err('concept', k.id, 'week', k.week, 'not defined');
    const cps = c.qs.filter(q => q.cp === k.id);
    if (cps.length < 3) err('concept', k.id, 'has', cps.length, 'checkpoints (need ≥ 3)');
    if (!cps.some(q => q.type === 'short' && q.model)) err('concept', k.id, 'has no self-graded short checkpoint with a model answer');
    if (/undefined|NaN/.test(CONCEPT_FIELDS.map(f => typeof k[f] === 'string' ? k[f] : '').join(' '))) err('concept', k.id, 'contains "undefined"/"NaN" text');
  });
  /* questions */
  c.qs.forEach(q => {
    if (!LABELS[q.src]) err(q.id, 'bad label', q.src);
    if (!QTYPES.includes(q.type)) err(q.id, 'bad type', q.type);
    if (!q.q) err(q.id, 'empty stem');
    (q.cs || []).forEach(id => { if (!c.cmap[id]) err(q.id, 'unknown concept', id); });
    if (!q.cs || !q.cs.length) err(q.id, 'not mapped to any concept');
    if (q.week == null) err(q.id, 'no week');
    if (q.type === 'mcq') {
      if (!Array.isArray(q.opts) || q.opts.length < 2) err(q.id, 'mcq needs options');
      else if (!(Number.isInteger(q.ans) && q.ans >= 0 && q.ans < q.opts.length)) err(q.id, 'bad mcq ans index', q.ans);
    }
    if (q.type === 'msq') {
      if (!Array.isArray(q.ans) || !q.ans.length || q.ans.some(a => !Number.isInteger(a) || a < 0 || a >= (q.opts || []).length)) err(q.id, 'bad msq ans', JSON.stringify(q.ans));
    }
    if ((q.type === 'mcq' || q.type === 'msq') && q.why && q.why.length !== q.opts.length) err(q.id, 'why has', q.why.length, 'entries for', q.opts.length, 'options');
    if ((q.type === 'mcq' || q.type === 'msq') && (q.src === 'PYQ' || q.src === 'VARIATION') && !q.why) err(q.id, 'PYQ/variation needs a why for every option');
    if (q.type === 'num' && typeof q.ans !== 'number') err(q.id, 'num ans must be a number');
    if (q.type === 'text' && typeof q.ans !== 'string') err(q.id, 'text ans must be a string');
    if (q.type === 'short' && !q.model) err(q.id, 'short question needs a model answer');
    if (!q.sol && q.type !== 'short') err(q.id, 'no step-by-step solution');
    if (!['easy', 'moderate', 'hard'].includes(q.diff)) err(q.id, 'bad diff', q.diff);
    if (q.src === 'PYQ') {
      if (!c.papers[q.paper]) err(q.id, 'unknown paper', q.paper);
      if (!q.fam || !c.families[q.fam]) err(q.id, 'missing/unknown family', q.fam);
      if (!q.trap) err(q.id, 'PYQ needs a trap note');
      if (!(c.vars[q.id] || []).length) err(q.id, 'PYQ has no variation');
      if (/^ET/.test(q.paper) && !(c.papers[q.paper] || {}).endTerm) err(q.id, 'end-term label on a paper not marked endTerm');
    }
    if (q.src === 'VARIATION') { q.varOf.forEach(id => { if (!c.qmap[id] || c.qmap[id].src !== 'PYQ') err(q.id, 'varies unknown PYQ', id); }); if (!q.kind) err(q.id, 'variation needs a kind'); }
  });
  (c.verify || []).forEach(v => { if (!v.ok) err('KEY MISMATCH', v.id, '—', v.msg); });
  const P = c.qs.filter(q => q.src === 'PYQ');
  const stats = { concepts: c.concepts.length, questions: c.qs.length, pyq: P.length,
    variations: c.qs.filter(q => q.src === 'VARIATION').length, checkpoints: c.qs.filter(q => q.cp).length,
    computedKeys: (c.verify || []).length, pyqWithoutVariation: P.filter(q => !(c.vars[q.id] || []).length).length,
    glossary: c.gloss.length, flashcards: c.cards.length, families: Object.keys(c.families).length };
  return { errors: E, warnings: W, stats };
}
